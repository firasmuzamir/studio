<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sifu Tangkap Studios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/nocturne-9e02e9de-8ec6-41ec-be49-7edb28f4cd5f/styles.css">
<script src="_ds/nocturne-9e02e9de-8ec6-41ec-be49-7edb28f4cd5f/_ds_bundle.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Standalone fallbacks for the design-system tokens.
     :where() keeps specificity at 0, so the _ds stylesheet still wins
     wherever it is actually loaded. */
  :where(html) {
    --color-text:       #e9e7f5;
    --color-accent:     #9184d9;
    --color-accent-200: #b9b0e8;
    --color-accent-300: #9d94cf;
    --font-heading: "Bebas Neue", Impact, "Arial Narrow Bold", sans-serif;
    --font-body: "Inter", -apple-system, system-ui, sans-serif;
  }

  html, body { margin: 0; padding: 0; background: #161826; -webkit-text-size-adjust: 100%; }
  a { color: var(--color-accent); text-decoration: none; }
  a:hover { color: var(--color-accent-300); }
  a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  @keyframes hub-breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }

  /* Landing flourish: the mark spins up fast and coasts to a dead stop.
     4 turns (1440deg = 4 x 360) so it lands perfectly upright, and an
     expo-out curve so most of the rotation is spent in the first ~20% of
     the duration — reads as a hard spin bleeding off, not a linear turn.
     Runs once; `both` holds the final frame. */
  @keyframes hub-logo-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(1440deg); }
  }
  .hub-logo {
    animation: hub-logo-spin 3.2s cubic-bezier(0.16, 1, 0.3, 1) both;
    will-change: transform;
  }

  /* Mirrors the style-hover / style-active attributes on the three wedges
     so they respond without the DC runtime. Same values, so having both is a no-op. */
  main a:hover  { background: rgba(145,132,217,0.10) !important; }
  main a:active { background: rgba(145,132,217,0.16) !important; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
</helmet>

<div style="min-height: 100dvh; box-sizing: border-box; background: radial-gradient(120% 80% at 50% 40%, #1c1f31 0%, #161826 62%, #12131f 100%); color: var(--color-text); font-family: var(--font-body); display: flex; flex-direction: column; gap: clamp(20px, 5vw, 40px); padding: clamp(16px, 5vw, 32px);">

  <header style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
    <span style="display: block; width: 20px; height: 1px; background: linear-gradient(90deg, transparent, var(--color-accent));"></span>
    <span style="font-family: var(--font-heading); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--color-accent-300);">Sifu Tangkap Studios</span>
  </header>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center;">
    <div style="position: relative; width: min(86vw, 52vh, 420px); aspect-ratio: 1 / 1; display: grid; place-items: center; flex: none;">

      <sc-if value="{{ showRings }}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; inset: -18%; border-radius: 50%; background: radial-gradient(circle, rgba(145,132,217,0.30) 0%, rgba(145,132,217,0.12) 34%, transparent 66%); filter: blur(26px); animation: hub-breathe 7s ease-in-out infinite; pointer-events: none;"></div>
      </sc-if>

      <a href="sports.html" style="position: absolute; inset: 0; border-radius: 50%; clip-path: polygon(50% 50%, -36.6% 0%, 50% -50%, 136.6% 0%); background: transparent; transition: background .25s;" style-hover="background: rgba(145,132,217,0.10);" style-active="background: rgba(145,132,217,0.16);">
        <svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none;" aria-hidden="true">
          <path id="arc-top" d="M 12,50 A 38,38 0 0 1 88,50" fill="none"></path>
          <text style="font-family: var(--font-heading); font-size: 6px; letter-spacing: 1.4px; text-transform: uppercase; fill: var(--color-accent-200);">
            <textPath href="#arc-top" startOffset="50%" text-anchor="middle">SPORTS</textPath>
          </text>
        </svg>
      </a>

      <a href="events.html" style="position: absolute; inset: 0; border-radius: 50%; clip-path: polygon(50% 50%, 136.6% 0%, 136.6% 100%, 50% 150%); background: transparent; transition: background .25s;" style-hover="background: rgba(145,132,217,0.10);" style-active="background: rgba(145,132,217,0.16);">
        <svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; transform: rotate(-60deg);" aria-hidden="true">
          <path id="arc-event" d="M 12,50 A 38,38 0 0 0 88,50" fill="none"></path>
          <text style="font-family: var(--font-heading); font-size: 6px; letter-spacing: 1.4px; text-transform: uppercase; fill: var(--color-accent-200);">
            <textPath href="#arc-event" startOffset="50%" text-anchor="middle">EVENTS</textPath>
          </text>
        </svg>
      </a>

      <a href="photobooth.html" style="position: absolute; inset: 0; border-radius: 50%; clip-path: polygon(50% 50%, 50% 150%, -36.6% 100%, -36.6% 0%); background: transparent; transition: background .25s;" style-hover="background: rgba(145,132,217,0.10);" style-active="background: rgba(145,132,217,0.16);">
        <svg viewBox="0 0 100 100" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; transform: rotate(60deg);" aria-hidden="true">
          <path id="arc-booth" d="M 12,50 A 38,38 0 0 0 88,50" fill="none"></path>
          <text style="font-family: var(--font-heading); font-size: 6px; letter-spacing: 1.4px; text-transform: uppercase; fill: var(--color-accent-200);">
            <textPath href="#arc-booth" startOffset="50%" text-anchor="middle">PHOTOBOOTH</textPath>
          </text>
        </svg>
      </a>

      <div style="position: absolute; top: 50%; left: 50%; width: 50%; height: 1px; transform-origin: 0 50%; transform: rotate(-30deg); pointer-events: none;">
        <div style="margin-left: 58%; width: 42%; height: 1px; background: repeating-linear-gradient(90deg, rgba(145,132,217,0.55) 0 2px, transparent 2px 6px);"></div>
      </div>
      <div style="position: absolute; top: 50%; left: 50%; width: 50%; height: 1px; transform-origin: 0 50%; transform: rotate(90deg); pointer-events: none;">
        <div style="margin-left: 58%; width: 42%; height: 1px; background: repeating-linear-gradient(90deg, rgba(145,132,217,0.55) 0 2px, transparent 2px 6px);"></div>
      </div>
      <div style="position: absolute; top: 50%; left: 50%; width: 50%; height: 1px; transform-origin: 0 50%; transform: rotate(210deg); pointer-events: none;">
        <div style="margin-left: 58%; width: 42%; height: 1px; background: repeating-linear-gradient(90deg, rgba(145,132,217,0.55) 0 2px, transparent 2px 6px);"></div>
      </div>

      <div style="position: absolute; inset: 22%; display: grid; place-items: center; pointer-events: none;">
        <img class="hub-logo" src="assets/logotrans.png" alt="Sifu Tangkap Studios" style="position: relative; width: 86%; mix-blend-mode: lighten; user-select: none;" />
      </div>
    </div>
  </main>

  <sc-if value="{{ showContact }}" hint-placeholder-val="{{ true }}">
    <!-- <footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; font-size: 12px; color: var(--color-accent-300); letter-spacing: .04em;">
      <span>Klang Valley · KL · Selangor</span>
      <a href="https://instagram.com/sifutangkapstudios" style="min-height: 44px; display: inline-flex; align-items: center; color: var(--color-accent-300);" style-hover="color: var(--color-accent);">@sifutangkapstudios</a>
      <a href="https://wa.me/60197790361" style="min-height: 44px; display: inline-flex; align-items: center; color: var(--color-accent-300);" style-hover="color: var(--color-accent);">wa.me / +60 19 779 0361</a>
    </footer> -->
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showRings&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showContact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      showRings: this.props.showRings ?? true,
      showContact: this.props.showContact ?? true,
    };
  }
}
</script>
</body>
</html>
